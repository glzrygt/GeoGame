<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hometown Game - Turkey Trip</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-ui" style="display: none;">
        
        <div id="stats-bar">
            <div class="stats-left">
                <span id="timer">Time: 60</span>
                <span style="margin: 0 15px;">|</span>
                <span id="score">Score: 0</span>
            </div>
            
            <div class="stats-right">
                <div id="badge-collection"></div>
                
                <span id="lives">Lives: ❤️ ❤️ ❤️</span>
                <button id="mute-button" style="background:none; border:none; font-size:1.5em; cursor:pointer; margin-left:15px; color:white;">🔊</button>
            </div>
        </div>

    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script src="app.js"></script>

</body>
</html>
